<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#101114">
  <title>Remote Keyboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header>
      <div class="brand"><span class="signal" id="signal"></span><span>Remote Keyboard</span></div>
      <div class="status" id="status">Connecting…</div>
    </header>
    <section class="keyboard" id="keyboard" aria-label="Remote keyboard"></section>
    <footer>
      <span id="hint">Tap any key to type on your Windows computer</span>
      <button id="fullscreen" type="button">Full screen</button>
    </footer>
  </main>
  <section class="pairing" id="pairing" hidden>
    <div class="pairing-card">
      <span class="eyebrow">PRIVATE CONNECTION</span>
      <h1>Pair this iPad</h1>
      <p>Enter the six-digit code shown by the Windows receiver.</p>
      <form id="pairing-form">
        <input id="pairing-code" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="one-time-code" placeholder="000000" aria-label="Pairing code">
        <button type="submit">Connect</button>
      </form>
      <p class="pairing-error" id="pairing-error" aria-live="polite"></p>
      <p class="pairing-note">The code expires after 10 minutes and works once.</p>
    </div>
  </section>
  <script src="app.js"></script>
</body>
</html>
